services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile.mcp
    container_name: mcp-server
    environment:
      MCP_TRANSPORT: "http"
      MCP_HOST: "0.0.0.0"
      MCP_PORT: "8001"
      MCP_PATH: "/mcp"
    ports:
      - "8001:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s=socket.socket(); s.settimeout(1); s.connect(('127.0.0.1',8001)); s.close(); print('ok')"]
      interval: 2s
      timeout: 2s
      retries: 30

  agent-api:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: agent-api
    depends_on:
      mcp-server:
        condition: service_healthy
    environment:
      MCP_SERVER_URL: "http://mcp-server:8001/mcp"
      MCP_CONNECT_RETRIES: "60"
      MCP_CONNECT_DELAY_SEC: "0.5"
      GROQ_API_KEY: "${GROQ_API_KEY}"
      GROQ_MODEL: "${GROQ_MODEL}"
    ports:
      - "8000:8000"
    restart: unless-stopped